<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курс к стажировке во фронтенд</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151D19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Фронтенд">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app-shell — sticky module rail on the left, reading column on the right; rail becomes a horizontal strip on phones. Price-tag badges carry readiness. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#E8EEE7; --fg:#16201B; --muted:#5A695F; --line:#D3DCD3;
  --accent:#16794A; --accent-fg:#FFFFFF; --accent-soft:#DCEFE3;
  --tag:#F5C842; --tag-fg:#2A2205; --ok:#1E8A4C; --bad:#C2412D; --bad-soft:#FBE4DF; --code-bg:#EDF2EB;
  --f-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#151D19; --surface-2:#1D2822; --fg:#E3EBE5; --muted:#93A399; --line:#2B3730;
  --accent:#4CC38A; --accent-fg:#06140D; --accent-soft:#183327;
  --tag:#E9BE3A; --tag-fg:#1E1803; --ok:#4CC38A; --bad:#F07A63; --bad-soft:#3A1E18; --code-bg:#101814; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#151D19; --surface-2:#1D2822; --fg:#E3EBE5; --muted:#93A399; --line:#2B3730;
  --accent:#4CC38A; --accent-fg:#06140D; --accent-soft:#183327;
  --tag:#E9BE3A; --tag-fg:#1E1803; --ok:#4CC38A; --bad:#F07A63; --bad-soft:#3A1E18; --code-bg:#101814; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,3.4vw,2.3rem)} h2{font-size:1.35rem} h3{font-size:1.05rem;font-family:var(--f-body);font-weight:700}
p{margin:0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:.1em .35em;border-radius:5px}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto;font:13.5px/1.55 var(--f-mono)}
pre code{background:none;padding:0;font-size:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px 30px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:4px;padding:0 8px}
.brand b{font-family:var(--f-display);font-size:1rem;line-height:1.25}
.brand span{font-size:.8rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:.92rem;line-height:1.3}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav .t{flex:1;min-width:0}
.dot{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:700;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.dot.full{background:var(--accent);color:var(--accent-fg)}
.rail-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 10px;display:flex;flex-direction:column;gap:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.78rem;text-align:left}

main{padding-block:32px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.lead{font-size:1.08rem;color:var(--muted);max-width:65ch}

/* price tag */
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--tag);color:var(--tag-fg);padding:6px 14px 6px 20px;font-weight:700;font-variant-numeric:tabular-nums;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);border-radius:0 6px 6px 0;position:relative;line-height:1.2}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--bg)}
.tag small{font-weight:500;font-size:.75rem;opacity:.8}
.tag big{font-family:var(--f-display);font-size:1.6rem}

.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.ready{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ready .tag{padding:10px 18px 10px 26px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mod-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg);transition:border-color .15s,transform .15s}
.mod-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.mod-card .row{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap}
.mod-card .eyebrow{white-space:nowrap}
.filebox{display:flex;flex-direction:column;gap:12px}
.fstat{display:flex;align-items:center;gap:8px;font-size:.92rem}
.fstat i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.fstat.ok i{background:var(--ok)} .fstat.warn i{background:var(--tag)}
.filebox small{color:var(--muted);font-size:.82rem}
.mod-card p{font-size:.88rem;color:var(--muted)}
.pill{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.req{background:var(--accent-soft);color:var(--accent)}
.pill.plus{background:var(--surface-2);color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tscroll{overflow-x:auto}

.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.week{border-top:3px solid var(--accent);background:var(--surface);border-radius:0 0 12px 12px;padding:14px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.week b{font-family:var(--f-display);font-size:.9rem}
.week ul{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted)}

.check{display:flex;flex-direction:column;gap:2px}
.check label{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.94rem}
.check label:hover{background:var(--surface-2)}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through}

/* module */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;font-size:.95rem}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.tabs button .n{font-size:.75rem;font-weight:500;color:var(--muted);margin-left:4px}
.section{display:flex;flex-direction:column;gap:12px;max-width:72ch}
.section p,.section li{color:var(--fg)}
.section ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.callout{border-left:3px solid var(--tag);background:var(--surface);padding:12px 16px;border-radius:0 10px 10px 0;font-size:.94rem}
.stack{display:flex;flex-direction:column;gap:30px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q-text{font-size:1.1rem;font-weight:600;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{overflow-wrap:anywhere;text-align:left;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:10px;display:flex;gap:12px;align-items:flex-start;font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{width:24px;height:24px;flex:none;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:.75rem;font-weight:700}
.opt.right{border-color:var(--ok);background:var(--accent-soft)}
.opt.right .k{background:var(--ok);color:var(--accent-fg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.why{font-size:.93rem;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.result{display:flex;flex-direction:column;gap:14px;align-items:flex-start}

/* interview */
details.iq{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.iq summary{padding:13px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.iq summary::-webkit-details-marker{display:none}
details.iq summary::before{content:"+";font-family:var(--f-mono);color:var(--accent);font-weight:700;width:14px;flex:none}
details.iq[open] summary::before{content:"−"}
details.iq .a{padding:0 16px 14px 40px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
details.iq textarea{width:100%;min-height:70px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:8px 10px;font:inherit;font-size:.9rem;resize:vertical}

/* code task */
.editor{width:100%;min-height:260px;font:13.5px/1.55 var(--f-mono);background:var(--code-bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;resize:vertical;tab-size:2;white-space:pre;overflow:auto}
.tests{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.test{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;background:var(--surface)}
.test .s{font-weight:700;width:18px;flex:none}
.test.pass .s{color:var(--ok)} .test.fail .s{color:var(--bad)}
.test .m{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);word-break:break-word}
.solved{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:700}

/* order task */
.order-pool,.order-out{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:10px;border-radius:10px}
.order-pool{background:var(--surface-2)}
.order-out{border:1px dashed var(--line);flex-direction:column;flex-wrap:nowrap}
.chip{font-family:var(--f-mono);font-size:.85rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:left}
.chip:hover{border-color:var(--accent)}
.order-out .chip{display:flex;gap:10px}
.order-out .chip i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

/* playground */
.pg{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.pg-side{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600}
.field input,.field select,.field textarea{font:inherit;font-weight:400;font-size:.92rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:7px 6px;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.blist{display:flex;flex-direction:column;gap:6px}
.bitem{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;background:var(--surface);font-size:.86rem}
.bitem.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bitem .nm{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem.hid .nm{opacity:.45;text-decoration:line-through}
.ib{border:0;background:var(--surface-2);width:26px;height:26px;border-radius:6px;font-size:.8rem;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--accent-soft)}
.stage{background:repeating-linear-gradient(45deg,var(--surface-2) 0 10px,var(--bg) 10px 20px);border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto}
.device{margin:0 auto;transition:width .3s;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:100%}
.json{max-height:320px}

/* preview brands — demo content with its own palette */
.pv{--p:#1B8A3A;--p-fg:#fff;--a:#E23B2E;--pbg:#FFFFFF;--pfg:#1A1A1A;--pmuted:#6B6B6B;--card:#F4F6F3;--pr:16px;--pfont:'Golos Text',sans-serif;--hfont:'Unbounded',sans-serif;background:var(--pbg);color:var(--pfg);font-family:var(--pfont)}
.pv[data-brand="b"]{--p:#0E4D3A;--p-fg:#F3EBDD;--a:#B88A3B;--pbg:#FBF8F2;--pfg:#1F2A24;--pmuted:#6E6A5E;--card:#F0EADD;--pr:4px;--hfont:Georgia,'Times New Roman',serif}
.pv[data-brand="c"]{--p:#FFD400;--p-fg:#111;--a:#111111;--pbg:#FFFFFF;--pfg:#111;--pmuted:#555;--card:#FFF6BF;--pr:0px;--hfont:'Unbounded',sans-serif}
.pv-block{position:relative;cursor:pointer;outline:2px solid transparent;outline-offset:-2px}
.pv-block:hover{outline-color:rgba(80,140,255,.5)}
.pv-block.sel{outline-color:#3D7BFF}
.pv-hero{background:var(--p);color:var(--p-fg);padding:28px 22px;display:flex;flex-direction:column;gap:10px}
.pv-hero h4{font-family:var(--hfont);font-size:clamp(1.2rem,4vw,1.8rem);margin:0;line-height:1.15}
.pv-hero p{opacity:.85;font-size:.95rem}
.pv-cta{align-self:flex-start;background:var(--p-fg);color:var(--p);border:0;border-radius:var(--pr);padding:9px 16px;font-weight:700;font-size:.9rem}
.pv-promo{background:var(--a);color:#fff;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
.pv[data-brand="c"] .pv-promo{color:#FFD400}
.pv-promo b{font-family:var(--hfont);font-size:1.3rem}
.pv-grid{padding:20px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pv-card{background:var(--card);border-radius:var(--pr);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.82rem}
.pv-img{aspect-ratio:1;border-radius:calc(var(--pr) * .6);background:linear-gradient(135deg,rgba(0,0,0,.06),rgba(0,0,0,.14))}
.pv-price{font-weight:800;font-size:1rem}
.pv-old{color:var(--pmuted);text-decoration:line-through;font-size:.78rem;margin-left:6px;font-weight:400}
.pv-text{padding:18px 22px;color:var(--pfg);font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.pv-text h5{font-family:var(--hfont);font-size:1.05rem;margin:0}
.pv-empty{padding:40px 20px;text-align:center;color:var(--pmuted);font-size:.9rem}

.proj ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.app-version{margin:8px 0 0;text-align:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.foot-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}


/* training */
.tr-seg button{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25;padding:8px 6px}
.tr-seg small{font-weight:500;font-size:.72rem;opacity:.85;font-variant-numeric:tabular-nums}
.term,.cmp,.build{display:flex;flex-direction:column;gap:14px}
.term-t{font-family:var(--f-display);font-size:clamp(1.3rem,4.5vw,1.7rem);line-height:1.2;padding:6px 0}
.term-parts{display:grid;gap:10px}
.term-part{padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:.95rem}
.term-part b{display:block;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.term-part.vs{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tag)}
.hint{font-size:.9rem;color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:.72rem;font-weight:700;color:var(--muted);padding:0;display:grid;place-items:center}
.dots button.on{border-color:var(--accent);color:var(--fg);box-shadow:0 0 0 1px var(--accent)}
.dots button.done{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cmp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp-col{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);min-width:0}
.cmp-col.win{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.cmp-col.lose{border-color:var(--bad)}
.cmp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
.cmp-col pre{font-size:12.5px;padding:10px 12px}
.cmp-res{display:flex;flex-direction:column;gap:6px}
.cmp-hidden{border:1px dashed var(--line);border-radius:8px;padding:16px 10px;text-align:center;color:var(--muted);font-size:.85rem}
pre.cmp-out{background:#0F1A14;color:#CFE8D8;border-color:#0F1A14}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.rows li{display:flex;gap:8px;align-items:flex-start;padding:6px 9px;border-radius:8px;background:var(--surface)}
.rows li i{font-style:normal;font-weight:700;flex:none;width:14px}
.rows .y i{color:var(--ok)} .rows .n i{color:var(--bad)}
.cmp-live{border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.pts{display:flex;flex-direction:column;gap:8px}
.pt{text-align:left;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:10px;display:flex;gap:12px;align-items:flex-start;font-size:.95rem;color:var(--fg)}
.pt:hover:not(:disabled){border-color:var(--accent)}
.pt .k{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:700;margin-top:1px}

    desc:`Напиши функцию <code>cartTotal(items, promo)</code>.<ul><li><code>items</code> — массив <code>{ price, qty }</code>.</li><li><code>promo</code> — <code>null</code>, <code>{ type: 'percent', value: 10 }</code> или <code>{ type: 'fixed', value: 150 }</code>.</li><li>Итог не может быть меньше 0, округляй до копеек (2 знака) и возвращай число.</li></ul>`,

  // твой код
}`,
    solution:`function cartTotal(items, promo) {
  const sum = items.reduce((s, i) => s + i.price * i.qty, 0);
  let total = sum;
  if (promo?.type === 'percent') total = sum * (1 - promo.value / 100);
  if (promo?.type === 'fixed') total = sum - promo.value;
  return Math.max(0, Math.round(total * 100) / 100);
}`,

    desc:`Напиши <code>cartReducer(state, action)</code>. Состояние — <code>{ items: [{ id, qty }] }</code>.<ul><li><code>{ type: 'add', id }</code> — если товар есть, увеличить qty на 1, иначе добавить с qty 1.</li><li><code>{ type: 'remove', id }</code> — уменьшить qty; при 0 убрать товар.</li><li><code>{ type: 'clear' }</code> — пустая корзина.</li><li>Неизвестный action — вернуть тот же state.</li><li><b>Нельзя мутировать</b> исходный state — тесты это проверяют.</li></ul>`,

    solution:`function cartReducer(state, action) {
  switch (action.type) {
    case 'add': {
      const exists = state.items.some(i => i.id === action.id);
      return {
        ...state,
        items: exists
          ? state.items.map(i => i.id === action.id ? { ...i, qty: i.qty + 1 } : i)
          : [...state.items, { id: action.id, qty: 1 }]
      };
    }
    case 'remove':
      return {
        ...state,
        items: state.items
          .map(i => i.id === action.id ? { ...i, qty: i.qty - 1 } : i)
          .filter(i => i.qty > 0)
      };
    case 'clear':
      return { ...state, items: [] };
    default:
      return state;
  }
}`,

     code:`

{
  "slug": "fruit-week",
  "brand": "discounter",
  "blocks": [
    { "id": "b1", "type": "hero", "title": "Неделя фруктов", "ctaUrl": "/catalog/fruits" },
    { "id": "b2", "type": "products", "categoryId": "fruits", "limit": 8 },
    { "id": "b3", "type": "timer", "endsAt": "2026-12-01T00:00:00+03:00" }
  ]
}

// registry.ts
export const registry = {
  hero:     { Component: HeroBlock,     defaults: { title: 'Заголовок' } },
  products: { Component: ProductsBlock, defaults: { limit: 8 } },
  timer:    { Component: TimerBlock,    defaults: {} },
} satisfies Record<Block['type'], BlockDefinition>;

// PageRenderer.tsx
export function PageRenderer({ blocks }: { blocks: Block[] }) {
  return blocks.map(block => {
    const def = registry[block.type];
    if (!def) return null;                       // + лог в мониторинг
    const { Component } = def;
    return (
      <ErrorBoundary key={block.id} fallback={null}>
        <Component {...def.defaults} {...block} />
      </ErrorBoundary>
    );
  });
}`},

    desc:`Напиши <code>visibleBlocks(blocks, brand, now)</code>, которая возвращает <b>массив id</b> блоков для показа:<ul><li>Убрать блоки с <code>hidden: true</code>.</li><li>Если у блока есть <code>brands</code> (массив), бренд должен в нём быть. Нет поля — блок для всех.</li><li>Если есть <code>startsAt</code> / <code>endsAt</code> (ISO-строки), то <code>now</code> (объект Date) должен быть в диапазоне <code>startsAt ≤ now &lt; endsAt</code>.</li><li>Отсортировать по <code>order</code> по возрастанию, не мутируя исходный массив.</li></ul>`,
    fn:'visibleBlocks',
    starter:`function visibleBlocks(blocks, brand, now) {

}`,
    solution:`function visibleBlocks(blocks, brand, now) {
  const t = now.getTime();
  return blocks
    .filter(b => !b.hidden)
    .filter(b => !b.brands || b.brands.includes(brand))
    .filter(b => !b.startsAt || Date.parse(b.startsAt) <= t)
    .filter(b => !b.endsAt || t < Date.parse(b.endsAt))
    .slice()
    .sort((a, b) => a.order - b.order)
    .map(b => b.id);
}`,

/* ---------- state ---------- */
const APP_VERSION = '1.1.2';
const KEY = 'fe-intern-course-v1';
let S = {read:{}, quiz:{}, task:{}, code:{}, check:{}, notes:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
// passing the quiz counts as having read the theory: before 1.1.0 theory was only
// counted via the "Прочитал" button, so a module could get stuck at 80-86%
function fixRead(){ MODULES.forEach(m=>{ if (S.quiz[m.id] > 0) S.read[m.id] = true; }); }
fixRead();
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} scheduleFileWrite(); };

/* ---------- progress file ---------- */
const FS_OK = typeof window.showSaveFilePicker === 'function';
let fileHandle = null;     // handle with write permission
let pendingHandle = null;  // remembered handle that needs a click to re-grant permission
let fileMsg = '';
let writeTimer = null;

function idb(op, val){
  return new Promise(res => {
    try {
      const r = indexedDB.open('fe-intern-course', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('h');
      r.onsuccess = () => {
        const tx = r.result.transaction('h', op === 'get' ? 'readonly' : 'readwrite');
        const st = tx.objectStore('h');
        const q = op === 'get' ? st.get('file') : op === 'set' ? st.put(val, 'file') : st.delete('file');
        q.onsuccess = () => res(q.result); q.onerror = () => res(null);
      };
      r.onerror = () => res(null);
    } catch(e) { res(null); }
  });
}
function exportData(){
  return JSON.stringify({app:'fe-intern-course', version:1, savedAt:new Date().toISOString(), progress:S, playground:typeof pg !== 'undefined' ? pg : null}, null, 2);
}
function applyData(text){
  const d = JSON.parse(text);
  if (!d || d.app !== 'fe-intern-course') throw new Error('Это не файл прогресса курса');
  S = Object.assign({read:{}, quiz:{}, task:{}, code:{}, check:{}, notes:{}}, d.progress || {});
  fixRead();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  if (d.playground && Array.isArray(d.playground.blocks)) { pg = d.playground; try { localStorage.setItem(KEY+'-pg', JSON.stringify(pg)); } catch(e) {} }
  state.quiz = {}; state.order = {}; state.train = {};
}
function scheduleFileWrite(){
  if (!fileHandle) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(writeFile, 400);
}
async function writeFile(){
  if (!fileHandle) return;
  try {
    const w = await fileHandle.createWritable();
    await w.write(exportData()); await w.close();
    fileMsg = 'Сохранено в файл в ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  } catch(e) { fileMsg = 'Не удалось записать файл: ' + e.message; }
  updateFileUI();
}
async function connectNewFile(){
  try {
    const h = await window.showSaveFilePicker({suggestedName:'fe-course-progress.json', types:[{description:'Прогресс курса', accept:{'application/json':['.json']}}]});
    fileHandle = h; pendingHandle = null; await idb('set', h); await writeFile();
  } catch(e) { if (e.name !== 'AbortError') { fileMsg = 'Ошибка: ' + e.message; updateFileUI(); } }
}
async function openExistingFile(){
  try {
    const [h] = await window.showOpenFilePicker({types:[{description:'Прогресс курса', accept:{'application/json':['.json']}}]});
    const text = await (await h.getFile()).text();
    applyData(text);
    if ((await h.requestPermission({mode:'readwrite'})) === 'granted') { fileHandle = h; pendingHandle = null; await idb('set', h); fileMsg = 'Прогресс загружен, изменения пишутся в этот файл'; }
    else fileMsg = 'Прогресс загружен, но запись в файл не разрешена';
    render();
  } catch(e) { if (e.name !== 'AbortError') { fileMsg = 'Ошибка: ' + e.message; updateFileUI(); } }
}
async function resumeFile(){
  if (!pendingHandle) return;
  try {
    if ((await pendingHandle.requestPermission({mode:'readwrite'})) !== 'granted') return;
    const h = pendingHandle; pendingHandle = null;
    await loadFromHandle(h);
  } catch(e) { fileMsg = 'Ошибка: ' + e.message; updateFileUI(); }
}
async function loadFromHandle(h){
  fileHandle = h;
  try {
    const text = await (await h.getFile()).text();
    if (text.trim()) {
      const d = JSON.parse(text);
      if ((d.progress?.savedAt || 0) >= (S.savedAt || 0)) applyData(text); else await writeFile();
    }
    fileMsg = 'Файл подключён, изменения сохраняются автоматически';
  } catch(e) { fileMsg = 'Файл подключён, но прочитать его не удалось: ' + e.message; }
  render();
}
async function disconnectFile(){
  fileHandle = null; pendingHandle = null; await idb('del'); fileMsg = 'Файл отключён, прогресс хранится только в браузере'; updateFileUI();
}
function downloadCopy(){
  const blob = new Blob([exportData()], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'fe-course-progress.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  fileMsg = 'Копия скачана в папку загрузок'; updateFileUI();
}
function loadFromInput(input){
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { applyData(r.result); fileMsg = 'Прогресс загружен из «' + f.name + '»'; render(); } catch(e) { fileMsg = 'Ошибка: ' + e.message; updateFileUI(); } };
  r.readAsText(f);
}
function fileBoxHtml(){
  const name = fileHandle?.name || pendingHandle?.name;
  const cls = fileHandle ? 'ok' : pendingHandle ? 'warn' : '';
  const status = fileHandle ? 'Пишется в файл «' + esc(name) + '»' : pendingHandle ? 'Файл «' + esc(name) + '» ждёт разрешения' : 'Файл не подключён, прогресс только в браузере';
  return `
    <div class="fstat ${cls}"><i></i><span>${status}</span></div>
    <div class="btns">
      ${FS_OK ? (pendingHandle ? `<button class="btn primary" data-fa="resume">Продолжить запись в «${esc(name)}»</button>` : '') +
        (!fileHandle ? `<button class="btn ${pendingHandle?'':'primary'}" data-fa="new">Создать файл прогресса</button><button class="btn" data-fa="open">Открыть существующий файл</button>` : `<button class="btn" data-fa="off">Отключить файл</button>`) : ''}
      <button class="btn" data-fa="dl">Скачать копию</button>
      <label class="btn" for="progressUpload" style="cursor:pointer">Загрузить из файла</label>
      <input type="file" id="progressUpload" accept=".json,application/json" hidden>
    </div>
    ${fileMsg ? `<small>${esc(fileMsg)}</small>` : ''}
    <small>${FS_OK ? 'Подключённый файл обновляется сам после каждого действия. Работает в Chrome, Edge и Яндекс Браузере, если открыть course.html с диска.' : 'Этот браузер не умеет писать в файл напрямую. Нажимай «Скачать копию», чтобы сохранить прогресс, и «Загрузить из файла», чтобы восстановить.'}</small>`;
}
function updateFileUI(){
  document.querySelectorAll('.filebox').forEach(box => {
    box.innerHTML = fileBoxHtml();
    box.querySelectorAll('[data-fa]').forEach(b => b.onclick = () => ({new:connectNewFile, open:openExistingFile, resume:resumeFile, off:disconnectFile, dl:downloadCopy})[b.dataset.fa]());
    const inp = box.querySelector('#progressUpload'); if (inp) inp.onchange = () => loadFromInput(inp);
  });
  const rs = document.getElementById('railFile');
  if (rs) rs.textContent = fileHandle ? 'Прогресс пишется в «' + fileHandle.name + '».' : 'Прогресс хранится в браузере. Файл можно подключить на странице «Обзор».';
}
async function initFile(){
  if (!FS_OK) return;
  const h = await idb('get');
  if (!h || typeof h.queryPermission !== 'function') return;
  try {
    if ((await h.queryPermission({mode:'readwrite'})) === 'granted') await loadFromHandle(h);
    else { pendingHandle = h; updateFileUI(); }
  } catch(e) {}
}

function modProgress(m){
  let got = 0, max = 0;
  max += 1; if (S.read[m.id]) got += 1;
  max += 2; got += 2 * (S.quiz[m.id] || 0);
  if (m.task){ max += 2; if (S.task[m.id]) got += 2; }
  if (TRAIN[m.id]){ max += 2; got += 2 * trainProgress(m); }
  return got / max;
}
function totalProgress(){
  const mods = MODULES.reduce((s,m)=>s+modProgress(m),0) / MODULES.length;
  const chk = Object.values(S.check).filter(Boolean).length / CHECKLIST.length;
  return Math.round((mods * 0.8 + chk * 0.2) * 100);
}

/* ---------- test helpers ---------- */
function eq(got, exp){
  const g = JSON.stringify(got), e = JSON.stringify(exp);
  return g === e || ('ожидалось ' + e + ', получено ' + g);
}

/* training tab */
const TS = () => S.train || (S.train = {terms:{}, cmp:{}, build:{}});
const trCount = (m, arr, store) => arr.filter((_,i)=>store[m.id+':'+i]).length;
function trainProgress(m){
  const t = TRAIN[m.id]; if (!t) return 0; const s = TS();
  return (trCount(m,t.terms,s.terms)/t.terms.length + trCount(m,t.cmp,s.cmp)/t.cmp.length + trCount(m,t.build,s.build)/t.build.length) / 3;
}
function trState(m){
  const t = TRAIN[m.id];
  return state.train[m.id] || (state.train[m.id] = {
    mode:'terms', queue:null, qi:0, flip:false,
    ci:0, swap:t.cmp.map(()=>Math.random()<.5), pick:{},
    bi:0, order:t.build.map(b=>shuffle(b.pts.map((_,i)=>i))), sel:{}, checked:{}
  });
}
function renderTrain(m, body){
  const t = TRAIN[m.id], st = trState(m), s = TS();
  const modes = [['terms','Термины',trCount(m,t.terms,s.terms)+'/'+t.terms.length],['cmp','Сравни',trCount(m,t.cmp,s.cmp)+'/'+t.cmp.length],['build','Собери ответ',trCount(m,t.build,s.build)+'/'+t.build.length]];
  body.innerHTML = `<div class="stack" style="gap:16px">
    <p class="lead" style="font-size:.95rem">Шаг между квизом и собеседованием. Разбери термины своими словами, сравни похожие варианты и посмотри на разницу в результате, потом собери каркас ответа для интервьюера.</p>
    <div class="seg tr-seg">${modes.map(x=>`<button data-mode="${x[0]}" class="${st.mode===x[0]?'on':''}" aria-pressed="${st.mode===x[0]}">${x[1]}<small>${x[2]}</small></button>`).join('')}</div>
    <div id="trBody"></div></div>`;
  body.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode; renderTrain(m, body);});
  const tb = $('#trBody');
  const rer = () => { save(); renderNav(); renderTrain(m, body); };
  if (st.mode==='terms') trTerms(m, t, st, s, tb, rer);
  if (st.mode==='cmp') trCmp(m, t, st, s, tb, rer, body);
  if (st.mode==='build') trBuild(m, t, st, s, tb, rer);
}
function trTerms(m, t, st, s, tb, rer){
  const known = i => s.terms[m.id+':'+i];
  if (!st.queue){ st.queue = t.terms.map((_,i)=>i).sort((a,b)=>(known(a)?1:0)-(known(b)?1:0)); st.qi = 0; st.flip = false; }
  const n = trCount(m, t.terms, s.terms);
  if (st.qi >= st.queue.length){
    const weak = t.terms.map((_,i)=>i).filter(i=>!known(i));
    tb.innerHTML = `<div class="panel result"><span class="eyebrow">Карточки пройдены</span><span class="tag"><big>${n}/${t.terms.length}</big></span>
      <p>${weak.length?'Вернись к оставшимся терминам — лучше короткими подходами в разные дни, чем всё за раз.':'Все термины понятны. Проверь себя в сравнениях: там те же идеи, но на коде.'}</p>
      <div class="btns">${weak.length?`<button class="btn primary" id="tWeak">Повторить непонятые (${weak.length})</button>`:`<button class="btn primary" id="tCmp">К сравнениям →</button>`}<button class="btn" id="tAll">Пройти все заново</button></div></div>`;
    const w = $('#tWeak'); if (w) w.onclick = () => { st.queue = weak; st.qi = 0; st.flip = false; rer(); };
    const c = $('#tCmp'); if (c) c.onclick = () => { st.mode = 'cmp'; rer(); };
    $('#tAll').onclick = () => { st.queue = shuffle(t.terms.map((_,i)=>i)); st.qi = 0; st.flip = false; rer(); };
    return;
  }
  const i = st.queue[st.qi], x = t.terms[i];
  tb.innerHTML = `<div class="panel term">
    <div class="q-head"><span>Карточка ${st.qi+1} из ${st.queue.length}</span><span>понятно ${n} из ${t.terms.length}</span></div>
    <div class="term-t">${esc(x.t)}</div>
    ${st.flip ? `<div class="term-parts">
        <div class="term-part"><b>Простыми словами</b>${esc(x.s)}</div>
        <div class="term-part"><b>Представь</b>${esc(x.an)}</div>
        <div class="term-part vs"><b>Не путай с</b>${esc(x.vs)}</div></div>
      <div class="btns"><button class="btn" id="tAgain">Ещё не уверен</button><button class="btn primary" id="tGot">Понятно, могу объяснить</button></div>`
    : `<p class="hint">Сначала попробуй объяснить сам: что это такое и с чем это легко перепутать? Потом открой подсказку и сравни.</p>
      <div class="btns"><button class="btn primary" id="tFlip">Показать объяснение</button></div>`}
  </div>`;
  const f = $('#tFlip'); if (f) f.onclick = () => { st.flip = true; rer(); };
  const a = $('#tAgain'); if (a) a.onclick = () => { s.terms[m.id+':'+i] = false; st.queue.push(i); st.qi++; st.flip = false; rer(); };
  const g = $('#tGot'); if (g) g.onclick = () => { s.terms[m.id+':'+i] = true; st.qi++; st.flip = false; rer(); };
}
function trRes(x, id){
  if (x.out) return `<pre class="cmp-out"><code>${esc(x.out)}</code></pre>`;
  if (x.rows) return `<ul class="rows">${x.rows.map(r=>`<li class="${r[0]?'y':'n'}"><i>${r[0]?'✓':'✗'}</i><span>${esc(r[1])}</span></li>`).join('')}</ul>`;
  return `<div class="cmp-live" data-live="${id}"></div>`;
}
function trCmp(m, t, st, s, tb, rer, body){
  const i = st.ci, c = t.cmp[i], sw = st.swap[i];
  const side = {L: sw ? c.b : c.a, R: sw ? c.a : c.b};
  const right = c.ans==='same' ? 'same' : ((c.ans==='a') !== sw ? 'L' : 'R');
  const pick = st.pick[i];
  const label = {L:'Вариант А', R:'Вариант Б', same:'Одинаково'};
  const col = k => `<div class="cmp-col ${pick ? (right===k||right==='same' ? 'win' : (pick===k ? 'lose' : '')) : ''}">
    <div class="cmp-h"><span>${label[k]}</span>${pick && pick===k ? '<span class="pill plus">твой выбор</span>' : ''}</div>
    ${code(side[k].code)}
    <div class="cmp-res"><span class="eyebrow">Результат</span>${pick ? trRes(side[k], k) : '<div class="cmp-hidden">Сначала сделай прогноз</div>'}</div></div>`;
  const last = i === t.cmp.length-1;
  tb.innerHTML = `<div class="panel cmp">
    <div class="q-head"><span>Сравнение ${i+1} из ${t.cmp.length}</span><div class="dots">${t.cmp.map((_,k)=>`<button data-ci="${k}" class="${k===i?'on':''} ${s.cmp[m.id+':'+k]?'done':''}" aria-label="Сравнение ${k+1}">${s.cmp[m.id+':'+k]?'✓':k+1}</button>`).join('')}</div></div>
    <p class="q-text">${esc(c.q)}</p>
    <div class="cmp-grid">${col('L')}${col('R')}</div>
    ${!pick ? `<div class="stack" style="gap:8px"><span class="eyebrow">Твой прогноз</span><div class="btns">${['L','R','same'].map(k=>`<button class="btn" data-pick="${k}">${label[k]}</button>`).join('')}</div></div>`
    : `<div class="why"><b>${pick===right?'Верно.':'Не совсем: правильный ответ — '+label[right].toLowerCase()+'.'}</b> ${esc(c.why).replace(/\{a\}/g, sw?'Б':'А').replace(/\{b\}/g, sw?'А':'Б')}</div>
       <div class="btns">${pick!==right?'<button class="btn" id="cRetry">Ещё раз</button>':''}<button class="btn primary" id="cNext">${last?'К сборке ответа →':'Следующее сравнение'}</button></div>`}
  </div>`;
  tb.querySelectorAll('[data-live]').forEach(el=>{
    const h = side[el.dataset.live].html, root = el.attachShadow({mode:'open'});
    root.innerHTML = `<style>:host{display:block}.lv{background:#fff;color:#1a1a1a;padding:10px;font:13px/1.4 system-ui,sans-serif}${h.css}</style><div class="lv">${h.html}</div>`;
  });
  tb.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ st.pick[i] = b.dataset.pick; if (b.dataset.pick===right) s.cmp[m.id+':'+i] = true; rer(); });
  tb.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{ st.ci = +b.dataset.ci; delete st.pick[st.ci]; rer(); });
  const r = $('#cRetry'); if (r) r.onclick = () => { delete st.pick[i]; st.swap[i] = Math.random()<.5; rer(); };
  const n = $('#cNext'); if (n) n.onclick = () => { if (last){ st.mode='build'; } else { st.ci = i+1; delete st.pick[st.ci]; } rer(); };
}
function trBuild(m, t, st, s, tb, rer){
  const i = st.bi, b = t.build[i], order = st.order[i];
  const sel = st.sel[i] || (st.sel[i] = []), checked = st.checked[i];
  const good = b.pts.filter(p=>p[0]).length;
  const got = sel.filter(j=>b.pts[j][0]).length, extra = sel.filter(j=>!b.pts[j][0]).length;
  const last = i === t.build.length-1;
  const pt = j => { const p = b.pts[j], on = sel.includes(j);
    let cls = '', mark = on ? '✓' : '';
    if (checked){ if (on && p[0]) cls='right'; else if (on) { cls='wrong'; mark='✗'; } else if (p[0]) { cls='miss'; mark='!'; } else cls='skip'; }
    const note = checked ? (p[0] ? (on ? '' : 'Пропущен — это стоит сказать.') : (on ? p[2] : 'Верно, что не выбрал: '+p[2].charAt(0).toLowerCase()+p[2].slice(1))) : '';
    return `<button class="pt ${cls}" data-j="${j}" aria-pressed="${on}" ${checked?'disabled':''}><span class="k">${mark}</span><span>${esc(p[1])}${note?`<small>${esc(note)}</small>`:''}</span></button>`; };
  tb.innerHTML = `<div class="panel build">
    <div class="q-head"><span>Вопрос ${i+1} из ${t.build.length}</span><div class="dots">${t.build.map((_,k)=>`<button data-bi="${k}" class="${k===i?'on':''} ${s.build[m.id+':'+k]?'done':''}" aria-label="Вопрос ${k+1}">${s.build[m.id+':'+k]?'✓':k+1}</button>`).join('')}</div></div>
    <p class="q-text">«${esc(b.q)}»</p>
    <p class="hint">Отметь тезисы, из которых сложится сильный ответ. Среди них есть популярные ошибки — их не бери.</p>
    <div class="pts">${order.map(pt).join('')}</div>
    ${!checked ? `<div class="btns"><button class="btn primary" id="bCheck" ${sel.length?'':'disabled'}>Проверить</button></div>`
    : `<div class="why"><b>Собрано ${got} из ${good}${extra?`, лишних: ${extra}`:''}.</b> ${got===good&&!extra?'Отличный каркас ответа.':'Посмотри пояснения под тезисами и попробуй ещё раз.'}</div>
       <div class="callout"><b>Каркас ответа</b><ol>${b.pts.filter(p=>p[0]).map(p=>`<li>${esc(p[1])}</li>`).join('')}</ol>Закрой экран и скажи ответ вслух своими словами за минуту. Если получилось — сверься во вкладке «Собеседование».</div>
       <div class="btns"><button class="btn" id="bRetry">Собрать заново</button><button class="btn primary" id="bNext">${last?(m.task?'К практике →':'К вопросам собеседования →'):'Следующий вопрос'}</button></div>`}
  </div>`;
  tb.querySelectorAll('[data-j]').forEach(el=>el.onclick=()=>{ const j=+el.dataset.j, k=sel.indexOf(j); if (k<0) sel.push(j); else sel.splice(k,1); rer(); });
  tb.querySelectorAll('[data-bi]').forEach(el=>el.onclick=()=>{ st.bi = +el.dataset.bi; rer(); });
  const c = $('#bCheck'); if (c) c.onclick = () => { st.checked[i] = true; if (got===good && !extra) s.build[m.id+':'+i] = true; rer(); };
  const r = $('#bRetry'); if (r) r.onclick = () => { st.sel[i] = []; st.checked[i] = false; st.order[i] = shuffle(b.pts.map((_,j)=>j)); rer(); };
  const n = $('#bNext'); if (n) n.onclick = () => { if (last){ state.tab[m.id] = m.task ? 'task' : 'interview'; render(); window.scrollTo(0,0); } else { st.bi = i+1; rer(); } };
}

/* quiz */
function renderQuiz(m, body){
  const qs = state.quiz[m.id] || (state.quiz[m.id] = {i:0, answers:[]});
  if (qs.i >= m.quiz.length){
    const right = qs.answers.filter((a,i)=>a===m.quiz[i].a).length;
    const best = Math.round((S.quiz[m.id]||0)*m.quiz.length);
    body.innerHTML = `<div class="panel result">
      <span class="eyebrow">Результат</span>
      <span class="tag"><big>${right}/${m.quiz.length}</big></span>
      <p>${right===m.quiz.length?'Отлично, квиз пройден без ошибок. Чтобы закрыть модуль на 100%, пройди тренировку'+(m.task?' и практику':'')+'.':right/m.quiz.length>=.7?'Хорошо. Перечитай теорию по ошибкам и пройди ещё раз.':'Стоит вернуться к теории и пройти квиз снова.'} Лучший результат: ${Math.max(best,right)}/${m.quiz.length}.</p>
      <div class="btns"><button class="btn primary" id="again">Пройти заново</button><button class="btn" id="toTrain">К тренировке →</button></div></div>`;
    $('#again').onclick = () => { state.quiz[m.id] = {i:0, answers:[]}; renderQuiz(m, body); };
    $('#toTrain').onclick = () => { state.tab[m.id]='train'; render(); window.scrollTo(0,0); };
    return;
  }
  const q = m.quiz[qs.i];
  const ans = qs.answers[qs.i];
  const answered = ans !== undefined;
  body.innerHTML = `<div class="panel q">
    <div class="q-head"><span>Вопрос ${qs.i+1} из ${m.quiz.length}</span><div class="bar" style="width:120px"><i style="width:${(qs.i)/m.quiz.length*100}%"></i></div></div>
    <p class="q-text">${esc(q.q)}</p>
    <div class="opts">${q.opts.map((o,i)=>{let c='';if(answered){if(i===q.a)c='right';else if(i===ans)c='wrong';}return `<button class="opt ${c}" data-i="${i}" ${answered?'disabled':''}><span class="k">${'АБВГ'[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div>
    ${answered?`<div class="why"><b>${ans===q.a?'Верно.':'Неверно.'}</b> ${esc(q.why)}</div><div class="btns"><button class="btn primary" id="nextQ">${qs.i+1<m.quiz.length?'Следующий вопрос':'Посмотреть результат'}</button></div>`:''}
  </div>`;
  body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    qs.answers[qs.i] = +b.dataset.i;
    if (qs.answers.length === m.quiz.length && qs.answers.every(a=>a!==undefined)){
      const score = qs.answers.filter((a,i)=>a===m.quiz[i].a).length / m.quiz.length;
      S.quiz[m.id] = Math.max(S.quiz[m.id]||0, score); S.read[m.id] = true; save(); renderNav();
    }
    renderQuiz(m, body);
  });
  const n = $('#nextQ'); if (n) n.onclick = () => { qs.i++; renderQuiz(m, body); };
}

/* code task */
function renderCode(m, body){
  const t = m.task;
  const src = S.code[m.id] ?? t.starter;
  body.innerHTML = `<div class="stack" style="gap:14px">
    <div class="section"><h2>${t.title}</h2><div>${t.desc}</div></div>
    <textarea class="editor" id="ed-${m.id}" spellcheck="false" aria-label="Редактор кода">${esc(src)}</textarea>
    <div class="btns"><button class="btn primary" id="run">Запустить тесты</button><button class="btn" id="resetCode">Вернуть исходный код</button><button class="btn" id="showSol">Показать решение</button>${S.task[m.id]?'<span class="solved">✓ Задача решена</span>':''}</div>
    <div class="tests" id="tests"></div>
    <div id="sol" hidden>${code(t.solution)}</div>
  </div>`;
  const ed = $('#ed-'+m.id);
  ed.addEventListener('keydown', e=>{
    if (e.key==='Tab'){ e.preventDefault(); const s=ed.selectionStart; ed.value=ed.value.slice(0,s)+'  '+ed.value.slice(ed.selectionEnd); ed.selectionStart=ed.selectionEnd=s+2; S.code[m.id]=ed.value; save(); }
    if ((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); run(); }
  });
  ed.oninput = () => { S.code[m.id] = ed.value; save(); };
  $('#resetCode').onclick = () => { ed.value = t.starter; S.code[m.id]=t.starter; save(); $('#tests').innerHTML=''; };
  $('#showSol').onclick = () => { $('#sol').hidden = !$('#sol').hidden; };
  $('#run').onclick = run;
  function run(){
    const out = $('#tests'); let fn;
    try { fn = new Function(ed.value + '\n;return typeof ' + t.fn + ' === "function" ? ' + t.fn + ' : null;')(); }
    catch(e){ out.innerHTML = `<div class="test fail"><span class="s">✗</span><div>Ошибка синтаксиса<div class="m">${esc(e.message)}</div></div></div>`; return; }
    if (!fn){ out.innerHTML = `<div class="test fail"><span class="s">✗</span><div>Функция <code>${t.fn}</code> не найдена</div></div>`; return; }
    let pass = 0;
    out.innerHTML = t.tests.map(tc=>{
      let r; try { r = tc.run(fn); } catch(e){ r = 'исключение: ' + e.message; }
      const ok = r === true; if (ok) pass++;
      return `<div class="test ${ok?'pass':'fail'}"><span class="s">${ok?'✓':'✗'}</span><div>${esc(tc.name)}${ok?'':`<div class="m">${esc(r)}</div>`}</div></div>`;
    }).join('') + `<div style="font-weight:700;padding:6px 2px">${pass} из ${t.tests.length} тестов пройдено${pass===t.tests.length?' — задача решена!':''}</div>`;
    if (pass === t.tests.length && !S.task[m.id]){ S.task[m.id]=true; save(); renderNav(); }
  }
}

/* order task */
function renderOrder(m, body){
  const t = m.task;
  const st = state.order[m.id] || (state.order[m.id] = {pool: shuffle(t.steps.map((s,i)=>i)), out:[]});
  const done = st.out.length === t.steps.length;
  const correct = done && st.out.every((v,i)=>v===i);
  body.innerHTML = `<div class="stack" style="gap:14px">
    <div class="section"><h2>${t.title}</h2><p>${t.desc}</p></div>
    <div><span class="eyebrow">Варианты</span><div class="order-pool">${st.pool.map(i=>`<button class="chip" data-p="${i}">${esc(t.steps[i])}</button>`).join('') || '<span style="color:var(--muted);font-size:.9rem;padding:6px">Все шаги расставлены</span>'}</div></div>
    <div><span class="eyebrow">Твой порядок</span><div class="order-out">${st.out.map((i,k)=>`<button class="chip" data-o="${k}"><i>${k+1}.</i>${esc(t.steps[i])}</button>`).join('') || '<span style="color:var(--muted);font-size:.9rem;padding:6px">Нажимай на шаги сверху</span>'}</div></div>
    ${done?(correct?`<div class="why"><span class="solved">✓ Всё верно!</span></div>`:`<div class="why"><b>Пока не так.</b> Первая ошибка на шаге ${st.out.findIndex((v,i)=>v!==i)+1}. Нажми на шаги, чтобы вернуть их, или начни заново.</div>`):''}
    <div class="btns"><button class="btn" id="ordReset">Начать заново</button>${S.task[m.id]?'<span class="solved">✓ Задание выполнено</span>':''}</div>
  </div>`;
  body.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const v=+b.dataset.p;st.pool=st.pool.filter(x=>x!==v);st.out.push(v);finish();});
  body.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const k=+b.dataset.o;st.pool.push(st.out[k]);st.out.splice(k,1);renderOrder(m,body);});
  $('#ordReset').onclick=()=>{state.order[m.id]=null;renderOrder(m,body);};
  function finish(){ if (st.out.length===t.steps.length && st.out.every((v,i)=>v===i) && !S.task[m.id]){ S.task[m.id]=true; save(); renderNav(); } renderOrder(m,body); }
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} if(a.every((v,i)=>v===i)&&a.length>1)[a[0],a[1]]=[a[1],a[0]]; return a; }

/* shrink a wide preview (768/1280) to fit a phone screen instead of letting it reflow */
function fitDevice(){
  const d = $('#pv'), note = $('#pgScale'); if (!d) return;
  const avail = d.parentNode.clientWidth - parseFloat(getComputedStyle(d.parentNode).paddingLeft) * 2;
  const w = +pg.width;
  if (w > avail + 1){ const k = avail / w; d.style.maxWidth = 'none'; d.style.zoom = k; note.hidden = false; note.textContent = `Превью ${WIDTHS[w]||w}px уменьшено до ${Math.round(k*100)}%`; }
  else { d.style.maxWidth = ''; d.style.zoom = ''; note.hidden = true; }
}
let fitT; window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitDevice, 100); });

function viewPlayground(){
  return `<div class="stack" style="gap:10px"><span class="eyebrow">Практика</span><h1>Песочница конструктора</h1></div><div id="tabBody"></div>`;
}

/* ---------- PWA: offline + install ---------- */
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installEvt = null;
const hintOff = () => { try { return localStorage.getItem(KEY+'-hint') === 'off'; } catch(e) { return false; } };
function installHintHtml(){
  if (!/^https?:$/.test(location.protocol) || isStandalone() || hintOff()) return '';
  if (!isIOS() && !installEvt) return '';
  return `<div class="callout install-hint" id="installHint"><b>Курс можно поставить на телефон как приложение</b> — он откроется с главного экрана и будет работать без интернета.
    ${isIOS() ? '<p style="margin-top:6px">В Safari нажми «Поделиться» <span aria-hidden="true">⎙</span>, затем «На экран „Домой“».</p>' : ''}
    <div class="btns" style="margin-top:10px">${installEvt ? '<button class="btn primary" id="installBtn">Установить</button>' : ''}<button class="btn" id="installNo">Скрыть</button></div></div>`;
}
function wireInstallHint(){
  const b = $('#installBtn'); if (b) b.onclick = async () => { installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt = null; $('#installHint')?.remove(); };
  const n = $('#installNo'); if (n) n.onclick = () => { try { localStorage.setItem(KEY+'-hint','off'); } catch(e) {} $('#installHint')?.remove(); };
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (currentRoute()==='home' && !$('#installHint')) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; $('#installHint')?.remove(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    // ask the browser not to evict saved progress
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  });
}

/* ---------- router ---------- */
const state = {tab:{}, quiz:{}, order:{}, train:{}};
function currentRoute(){ const h = location.hash.slice(1); return h || 'home'; }
function render(){
  const r = currentRoute();
  const view = $('#view');
  if (r.startsWith('m-')){
    const m = MODULES.find(x=>'m-'+x.id===r);
    if (m){ view.innerHTML = viewModule(m); view.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab[m.id]=b.dataset.tab; const tb=view.querySelector('.tabs'); const stuck=isNarrow()&&tb.getBoundingClientRect().top<=tb.offsetHeight+80; render(); if(stuck) view.querySelector('.tabs').scrollIntoView({block:'start'});}); renderTab(m); renderNav(); const ot=view.querySelector('.tabs button.on'); if(ot&&ot.offsetLeft) ot.parentNode.scrollLeft=ot.offsetLeft-ot.parentNode.clientWidth/2+ot.clientWidth/2; return; }
  }
  if (r==='project') view.innerHTML = viewProject();
  else if (r==='playground'){ view.innerHTML = viewPlayground(); renderPlayground($('#tabBody')); }
  else {
    view.innerHTML = viewHome();
    wireInstallHint();
    view.querySelectorAll('#checklist input').forEach(c=>c.onchange=()=>{S.check[c.dataset.i]=c.checked; save(); renderNav(); const t=view.querySelector('.ready .tag big'); if(t) t.textContent=totalProgress();});
  }
  renderNav();
  updateFileUI();
}
let lastRoute = null;
window.addEventListener('hashchange', ()=>{ render(); if (currentRoute()!==lastRoute) window.scrollTo(0,0); lastRoute=currentRoute(); });
lastRoute = currentRoute();
render();
initFile();

$('#reset').onclick = () => { $('#resetConfirm').hidden = false; $('#reset').hidden = true; };
$('#resetNo').onclick = () => { $('#resetConfirm').hidden = true; $('#reset').hidden = false; };
$('#resetYes').onclick = () => { S = {read:{}, quiz:{}, task:{}, code:{}, check:{}, notes:{}}; save(); state.quiz = {}; state.order = {}; state.train = {}; $('#resetConfirm').hidden = true; $('#reset').hidden = false; render(); };
</script>
